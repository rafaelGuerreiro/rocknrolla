document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

center;animation:roll 5.6s linear infinite;filter:drop-shadow(0 8px 8px rgba(20,10,18,.4));\"><use href=\"#b-egg\"><\u002Fuse><\u002Fsvg>\n        <svg width=\"66\" height=\"42\" style=\"position:absolute;left:67px;top:78px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:#f5ecd8;margin-top:6px;\">Egg<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#e6c9a0;text-align:center;margin-top:4px;line-height:1.4;\">Off-center weight. Wobbles, briefly balances on its point, then self-rights. Floats — bobs on water.<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(245,236,216,.12);width:100%;justify-content:center;\">\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(60deg);\"><use href=\"#b-egg\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:16px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(160deg);\"><use href=\"#b-egg\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:16px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(250deg);\"><use href=\"#b-egg\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:16px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- COCONUT -->\n    <div style=\"width:322px;flex:none;background:linear-gradient(180deg,rgba(58,36,52,.55),rgba(30,18,28,.55));border:1px solid rgba(245,236,216,.1);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;\">\n      <div style=\"align-self:flex-start;font:700 10px/1 'Space Mono',monospace;letter-spacing:.16em;color:#8f7f6c;\">04 · STEADY<\u002Fdiv>\n      <div style=\"position:relative;width:200px;height:190px;margin-top:6px;\">\n        <div style=\"position:absolute;left:48px;bottom:6px;width:104px;height:19px;background:rgba(20,10,20,.42);border-radius:50%;filter:blur(4px);\"><\u002Fdiv>\n        <svg width=\"150\" height=\"150\" style=\"position:absolute;left:25px;top:14px;transform-origin:center;animation:roll 4.8s linear infinite;filter:drop-shadow(0 8px 8px rgba(20,10,18,.4));\"><use href=\"#b-coco\"><\u002Fuse><\u002Fsvg>\n        <svg width=\"66\" height=\"42\" style=\"position:absolute;left:67px;top:74px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:#f5ecd8;margin-top:6px;\">Coconut<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#e6c9a0;text-align:center;margin-top:4px;line-height:1.4;\">Lumpy, nearly round. Rolls in little hops as its bumps hit — mostly steady, occasionally skips.<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(245,236,216,.12);width:100%;justify-content:center;\">\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(48deg);\"><use href=\"#b-coco\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(132deg);\"><use href=\"#b-coco\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(236deg);\"><use href=\"#b-coco\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PAPER BALL -->\n    <div style=\"width:322px;flex:none;background:linear-gradient(180deg,rgba(58,36,52,.55),rgba(30,18,28,.55));border:1px solid rgba(245,236,216,.1);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;\">\n      <div style=\"align-self:flex-start;font:700 10px/1 'Space Mono',monospace;letter-spacing:.16em;color:#8f7f6c;\">05 · FEATHERWEIGHT<\u002Fdiv>\n      <div style=\"position:relative;width:200px;height:190px;margin-top:6px;\">\n        <div style=\"position:absolute;left:50px;bottom:6px;width:100px;height:18px;background:rgba(20,10,20,.38);border-radius:50%;filter:blur(4px);\"><\u002Fdiv>\n        <svg width=\"150\" height=\"150\" style=\"position:absolute;left:25px;top:14px;transform-origin:center;animation:rollccw 3.6s linear infinite;filter:drop-shadow(0 8px 8px rgba(20,10,18,.4));\"><use href=\"#b-paper\"><\u002Fuse><\u002Fsvg>\n        <svg width=\"66\" height=\"42\" style=\"position:absolute;left:67px;top:74px;\"><use href=\"#f-nervous\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:#f5ecd8;margin-top:6px;\">Paper Ball<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#e6c9a0;text-align:center;margin-top:4px;line-height:1.4;\">Light &amp; creased. Barely any momentum — bounces off faces and drifts. Wind and water push it around.<\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(245,236,216,.12);width:100%;justify-content:center;\">\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(70deg);\"><use href=\"#b-paper\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-nervous\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(150deg);\"><use href=\"#b-paper\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-nervous\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:relative;width:44px;height:44px;\"><svg width=\"40\" height=\"40\" style=\"position:absolute;left:2px;top:2px;transform:rotate(255deg);\"><use href=\"#b-paper\"><\u002Fuse><\u002Fsvg><svg width=\"22\" height=\"14\" style=\"position:absolute;left:11px;top:15px;\"><use href=\"#f-nervous\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- ================= EXPRESSION LIBRARY ================= -->\n  <div style=\"width:100%;max-width:1000px;\">\n    <div style=\"font:700 11px/1 'Space Mono',monospace;letter-spacing:.18em;color:#b7a58f;text-transform:uppercase;margin-bottom:16px;\">Expression library — one face set, any body<\u002Fdiv>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n      <div style=\"width:130px;background:rgba(245,236,216,.06);border:1px solid rgba(245,236,216,.12);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"70\" height=\"44\"><use href=\"#f-happy\"><\u002Fuse><\u002Fsvg><div style=\"font:700 10px/1 'Space Mono',monospace;letter-spacing:.14em;color:#e6c9a0;\">HAPPY<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:130px;background:rgba(245,236,216,.06);border:1px solid rgba(245,236,216,.12);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"70\" height=\"44\"><use href=\"#f-determined\"><\u002Fuse><\u002Fsvg><div style=\"font:700 10px/1 'Space Mono',monospace;letter-spacing:.14em;color:#e6c9a0;\">DETERMINED<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:130px;background:rgba(245,236,216,.06);border:1px solid rgba(245,236,216,.12);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"70\" height=\"44\"><use href=\"#f-surprised\"><\u002Fuse><\u002Fsvg><div style=\"font:700 10px/1 'Space Mono',monospace;letter-spacing:.14em;color:#e6c9a0;\">SURPRISED<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:130px;background:rgba(245,236,216,.06);border:1px solid rgba(245,236,216,.12);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"70\" height=\"44\"><use href=\"#f-nervous\"><\u002Fuse><\u002Fsvg><div style=\"font:700 10px/1 'Space Mono',monospace;letter-spacing:.14em;color:#e6c9a0;\">NERVOUS<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:130px;background:rgba(245,236,216,.06);border:1px solid rgba(245,236,216,.12);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;\"><svg width=\"70\" height=\"44\"><use href=\"#f-dizzy\"><\u002Fuse><\u002Fsvg><div style=\"font:700 10px/1 'Space Mono',monospace;letter-spacing:.14em;color:#e6c9a0;\">DIZZY<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:400 12px/1.5 'Space Mono',monospace;color:#8f7f6c;margin-top:16px;max-width:760px;\">In Phaser: the body is a Matter Image whose angle tracks the physics; the face is a sibling in the same container placed at the body's centre with <span style=\"color:#f2a63c;\">rotation reset to 0<\u002Fspan> each frame. Swap the face texture on events — <span style=\"color:#f2a63c;\">dizzy<\u002Fspan> on a hard hit, <span style=\"color:#f2a63c;\">surprised<\u002Fspan> off a big jump.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { i: 0 };\n  componentDidMount() {\n    this._t = setInterval(\n      () => this.setState((s) => ({ i: (s.i + 1) % 5 })),\n      1400,\n    );\n  }\n  componentWillUnmount() {\n    clearInterval(this._t);\n  }\n  renderVals() {\n    const names = ['happy', 'determined', 'surprised', 'nervous', 'dizzy'];\n    const name = names[this.state.i];\n    return { demoHref: '#f-' + name, demoName: name.toUpperCase() };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
