<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RocknRolla — Asset Gallery</title>
    <style>
      :root {
        --card-bg: #ffffff;
        --text: #241d16;
        --chrome: #f0ede6;
      }
      body {
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        background: var(--chrome);
        color: var(--text);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 1.5rem;
        align-items: center;
        padding: 0.6rem 1rem;
        background: #241d16;
        color: #f5ecd8;
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
        margin-right: auto;
      }
      header label {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.85rem;
      }
      #gallery,
      #characters {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1rem;
        align-items: flex-start;
      }
      .card {
        background: var(--card-bg);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(36, 29, 22, 0.25);
        overflow: hidden;
        max-width: 100%;
      }
      .card .stage {
        overflow: auto;
        max-width: 90vw;
        max-height: 70vh;
        /* Checker so transparent regions read as transparent. */
        background: repeating-conic-gradient(
            rgba(128, 128, 128, 0.12) 0% 25%,
            transparent 0% 50%
          )
          0 0 / 24px 24px;
      }
      body.bg-light .stage {
        background: #fdfbf6;
      }
      body.bg-dark .stage {
        background: #241d16;
      }
      body.bg-sky .stage {
        background: linear-gradient(#33203c, #6d3a4e 38%, #c66240 72%, #f2a63c);
      }
      .card .meta {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .card .meta .slug {
        font-weight: 800;
      }
      .card .meta .hash {
        font-family: 'Space Mono', monospace;
        opacity: 0.7;
      }
      .empty {
        padding: 3rem;
        font-size: 1.1rem;
        opacity: 0.7;
      }
      .section-label {
        padding: 1rem 1rem 0;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.6;
      }
      svg [data-overlay] {
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-light">
    <header>
      <h1>Asset Gallery</h1>
      <label>
        zoom
        <select id="zoom">
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="1" selected>100%</option>
          <option value="2">200%</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="colliders" />
        colliders
      </label>
      <label>
        background
        <select id="background">
          <option value="light" selected>light</option>
          <option value="dark">dark</option>
          <option value="sky">game sky</option>
        </select>
      </label>
    </header>
    <div class="section-label">Components</div>
    <div id="gallery"></div>
    <div class="section-label">Characters</div>
    <div id="characters"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
